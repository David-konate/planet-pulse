spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  application:
    name: planetpulse-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
      open-in-view: false
  logging:
    level:
      org.springframework.web: DEBUG

restcountries:
  base-url: ${API_URL}
  api-key: ${API_KEY}