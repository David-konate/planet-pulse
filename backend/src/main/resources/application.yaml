spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  application:
    name: planetpulse-api
  datasource:
    url: ${URL_DATABASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

restcountries:
  base-url: https://api.restcountries.com/countries/v5
  api-key: ${APIRC_TOKEN}