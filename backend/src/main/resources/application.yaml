spring:
  application:
    name: planetpulse-api
  datasource:
    url: jdbc:postgresql://localhost:5433/planet_pulse
    username: admin
    password: ${DB_PASSWORD:change}
  jpa:
    hibernate:
      ddl-auto: validate
  config:
    import: optional:file:.env[.properties]

restcountries:
  base-url: https://api.restcountries.com/countries/v5
  api-key: ${APIRC_TOKEN}